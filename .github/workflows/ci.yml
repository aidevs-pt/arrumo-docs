name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:locales
      - run: pnpm lint
      - run: pnpm types:check
      - run: pnpm build
      - name: Check that every llms.txt link resolves
        run: |
          status=0
          for f in out/*/tools/arrumo/llms.txt; do
            for u in $(grep -o '](https://www.aidevs.pt/[^)]*)' "$f" | sed 's|](https://www.aidevs.pt/\(.*\))|\1|'); do
              case "$u" in
                tools/arrumo/static/* | es/* | pt/*) p="out/$u" ;;
                *) p="out/en/$u" ;;
              esac
              [ -f "$p" ] || [ -f "$p.html" ] || { echo "Missing in $f: $u"; status=1; }
            done
          done
          exit $status
